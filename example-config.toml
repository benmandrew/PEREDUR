#:schema ./schemas/config-schema.json
# PEREDUR configuration file
#
# Every section and key is optional; absent keys use the built-in defaults. Every
# value below IS that default, so copying this file whole changes nothing.
# scripts/check_config_schema.py enforces that against include/config.hpp as part
# of the lint target -- a default may not drift from this template.
#
# What each key means is in schemas/config-schema.json, which an editor reads via
# the #:schema line above. What to set and why -- the measurements behind each
# default -- is in docs/configuration.rst. Comments here cover only what neither
# of those records.

[genetic]
generations     = 10
population_size = 200
selection_rate  = 0.5
elitism_rate    = 0.1  # elites are a subset of the parents, so this must stay < selection_rate.
                       # Redundant on paper under NSGA-II, and kept at 0.1 for wall time
                       # alone: the 2026-08-23 monotone campaign puts 0 at 4.0% more wall
                       # time and level on yield and quality -- see include/config.hpp.
crossover_rate  = 0.1
mutation_rate   = 1.0  # per offspring, unlike the per-requirement rates in [mutation]
# "nsga2-truncate" | "nsga2-apportion" | "weighted". Under either NSGA-II scheme
# the [fitness] weights only select which components are active (weight > 0);
# they no longer bias selection, and the (mu+lambda) survivor pooling is already
# elitist, so elitism_rate = 0 is the natural companion on paper -- though it
# measured slower in both campaigns that tested it, which is why the default
# stays at 0.1.
# The two NSGA-II schemes rank identically and differ only in the survivor step.
# "nsga2-truncate" was the default until 2026-08-14; it costs about 26% less
# wall time on FRETISH and 13% less on TLSF, and is the arm to reach for when
# throughput matters more than how many repairs come back.
selection_scheme = "nsga2-apportion"
# Report every candidate that passed the output gate in any generation, not only
# the ones the final population still holds. On since 2026-08-25, on 200 paired
# TLSF runs: implies_ideal gained on 6 pairs and lost on none (McNemar
# p = 0.0312) for a median paired wall ratio of 1.034. That campaign made it a
# candidate default subject to a FRETISH replication that has not been run.
# Free on the FRETISH path, one gate sweep per generation on the TLSF one;
# live under [tlsf] repair_mode = "muc" too, over the reintegrated whole
# specifications rather than the core populations.
accumulate_repairs = true
# What ends the search. "generations" is PEREDUR's own budget: the rounds above,
# whatever they cost. "individuals" is AuRUS's, for a head-to-head where both
# tools get the same number of offspring rather than the same wall clock; it
# stops once max_individuals offspring have been bred, counted per offspring
# that differs from its parent and checked between offspring rather than at a
# generation boundary. generations still bounds the run under either.
termination     = "generations"
# Offspring budget under termination = "individuals"; ignored otherwise, and
# rejected at 0 there rather than read as unlimited.
max_individuals = 0
# Wall-clock deadline for the whole run in seconds, 0 for none. Honoured under
# both termination modes. A run that stops on its own deadline still writes
# run.json and its repairs, where one killed by the harness writes neither.
max_wall_s      = 0

[fitness]
# AuRUS's weights (Settings.java): its lost- and won-model terms, 0.1 each, are
# the one semantic term here.
weight_syntactic = 0.1
weight_semantic  = 0.2
weight_status    = 0.7
# "mrs" grades the unrealizable region by the fraction of guarantee-side parts a
# greedy sweep keeps realizable; "tiered" collapses that whole region to 0.5.
# "aurus" is AuRUS's own ladder, graded by which side is satisfiable alone, and
# is the one scale that does not penalise a candidate realizable only by
# defeating its own assumptions -- it is there to be ablated against, not used.
status_grading   = "mrs"  # or "tiered", "aurus"
# Which order that sweep admits parts in. "degree" defers the parts that
# conflict with most others, costing one pairwise pass over the input before the
# search starts; "spec" is the specification's own index order.
mrs_admission_order = "degree"  # or "spec"

[mutation]
# Per-requirement probabilities of rewriting each part of a FRETISH requirement.
p_trigger  = 0.5
p_response = 0.5
p_timing   = 0.15
# FRETISH only, at p_timing's rate. p_scope needs the specification to declare a
# mode to have anywhere to go. Set either to 0 to reproduce a run from before
# 2026-09-11, when both defaulted off.
p_condition_type = 0.15
p_scope          = 0.15
# FRETISH only: rewrites the stop condition of an `until` or `before` timing,
# and draws nothing on a requirement without one.
p_stop           = 0.15
# Both modes: the share of rewrites that take the monotone form, moving a
# formula along the implication order rather than rewriting it freely. On the
# FRETISH path it is offered inside the condition and response rewrites, on the
# TLSF path ahead of the temporal and propositional ones.
p_monotone       = 0.25
# Both modes: the probability that a mutation instead appends a new environment
# assumption, and the fraction of those guarded by a random input atom rather
# than by `true`.
p_add_assumption         = 0.05
p_conditional_assumption = 0.25
# The mirror action: delete a guarantee outright, never the last live one.
# Some repairs are unreachable without it. Set to 0 to reproduce a run from
# before the operator existed.
p_remove_guarantee       = 0.05

[tlsf]
# Read by both front ends, despite the section name.
repair_mode        = "monolithic"  # or "muc"
muc_max_iterations = 32            # muc mode only
# FRETISH muc mode only: the largest guarantee subset the core screen asks
# about, and the depth a provisional repair must screen clean to.
muc_screen_depth   = 3

[tlsf.mutation]
p_assumption = 0.3
p_temporal   = 0.2
# Of the assumptions [mutation] p_add_assumption appends, the fraction that copy
# an existing one instead of building from the template, which emits at most
# seven nodes where the assumption-shaped ideals run to thirty.
p_clone_assumption = 0.25
# The two keys below stand at their no-op values. The campaign that measured
# them (experiments/2026-08-26-assumption-reach) read null on its registered
# primary, so each stays off. At these values the RNG stream is what it was
# before the keys existed, and no archived config changes meaning.
#
# Widest disjunction an appended assumption's body may be: between 1 and this
# many distinct input literals. 1 draws no width, which is the no-op. Clamped
# to the input count.
max_assumption_width = 1
# Probability of leaving an appended assumption as `F body` rather than
# `G F body`. lily11's whole ideal is a bare `F req`, which no G-wrapped
# assumption rewrites into. 0 is the no-op.
p_bare_assumption = 0.0

[model_counting]
default_bound = 20
metric        = "logarithmic"  # or "direct"

[filters]
run_implication = true

[runtime]
# Per-call wall-clock budgets in ms; 0 disables one. Ganak takes none:
# counting is the fitness function's real work, so a slow count is usually a
# legitimately hard one rather than a blowup. The rest are bounded because an
# unbounded call can stall a whole run.
black_timeout_ms    = 1000
ltlsynt_timeout_ms  = 10000
ltl2tgba_timeout_ms = 60000
ltlfilt_timeout_ms  = 10000
# 0.15, not 0.05: the ltl2tgba budget drops individuals by design, and enough
# land in one generation on the heavy TLSF specs to trip a tighter bound.
max_scoring_failure_rate     = 0.15
dashboard = false
# parallel = 8   # thread pool size; the default is the hardware concurrency
                 # narrowed by the CPU affinity mask and the cgroup CPU quota,
                 # so this key has no fixed default to pin and stays commented
                 # out.
