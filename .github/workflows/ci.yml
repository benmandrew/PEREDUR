name: CI

on:
  push:
    branches:
      - main
  pull_request:
  # Nightly full-tree lint sweep at 03:00 UTC, which catches the header fan-out
  # the changed-file lint on PRs and pushes cannot see: clang-tidy findings are
  # per translation unit, so editing a header can break the TUs that include it
  # without touching a file the diff-scoped lint ever compiles. Scheduled runs
  # stop at the check job -- build-and-test is skipped, since this commit was
  # already built and tested on its way to main. Benchmarks live in
  # benchmark.yml.
  schedule:
    - cron: "0 3 * * *"
  # Manual trigger for an on-demand full sweep plus the whole build matrix.
  workflow_dispatch:

# A pull request supersedes its own earlier runs: pushing again makes the
# previous answer worthless, and without this it runs to completion anyway.
# Every other event takes a group of its own, github.run_id being unique,
# because sharing one would make consecutive pushes to main queue rather than
# run -- and a third push then cancels the pending middle commit, leaving a
# commit on main with no result at all.
concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.event_name == 'pull_request'
        && github.ref || github.run_id }}
  cancel-in-progress: true

env:
  SCCACHE_GHA_ENABLED: "true"

jobs:
  # The one place that decides what this run has to do, for all three consumers
  # below. It is a job rather than a step in each of them because
  # build-and-test's matrix has to be known before that job starts, and because
  # check and build-and-test would otherwise each need their own deep clone and
  # their own copy of the base-ref logic.
  #
  # A job bills a whole minute however briefly it runs, so this one is held to a
  # checkout and a diff. The two it replaced -- a staleness gate and a matrix
  # emitter, 4-6s and 2-4s of work respectively -- cost 15% of this repository's
  # runner minutes between them, every minute of it the per-job floor.
  setup:
    runs-on: ubuntu-latest
    outputs:
      # Anything to do at all (false only for a stale nightly).
      run: ${{ steps.plan.outputs.run }}
      # Lint/docs/config work for the check job.
      heavy: ${{ steps.plan.outputs.heavy }}
      full: ${{ steps.plan.outputs.full }}
      files: ${{ steps.plan.outputs.files }}
      docs: ${{ steps.plan.outputs.docs }}
      config: ${{ steps.plan.outputs.config }}
      # A build input moved, so build-and-test has something to re-derive.
      build: ${{ steps.plan.outputs.build }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          # Full history so pull-request and push runs can diff against the base
          # commit. The pack is about 4MB, so the depth costs nothing.
          fetch-depth: 0

      - name: Decide what this run has to do
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE: ${{ github.event.before }}
        run: |
          emit() { echo "$1=$2" >> "$GITHUB_OUTPUT"; }

          # The toolchain is pinned by the Nix flake, so a scheduled run over a
          # tree that has not moved since the previous night re-derives the same
          # lint and docs results from the same inputs -- pure runner minutes
          # for no signal. Pushes, pull requests and manual dispatch always run.
          if [ "$EVENT" = "schedule" ]; then
            age=$(( $(date +%s) - $(git log -1 --format=%ct) ))
            # 25h of slack over the 24h cron so a slightly-late trigger runs.
            if [ "$age" -ge 90000 ]; then
              emit run false
              emit heavy false
              emit build false
              # Never read -- every consumer is gated on run -- but a matrix
              # output that does not parse as JSON is an error rather than a
              # skip if anything downstream ever evaluates it.
              emit matrix '{"include":[]}'
              echo "No commits in the last 25h; skipping the nightly sweep."
              exit 0
            fi
            echo "HEAD committed ${age}s ago; running the nightly sweep."
          fi
          emit run true

          # A full sweep lints the whole tree and always builds docs: the
          # nightly schedule, manual dispatch, and any run whose base ref is
          # unusable (branch creation, force-push, or a base commit not in local
          # history), where the silent alternative is linting nothing.
          full=false
          base=""
          case "$EVENT" in
            schedule|workflow_dispatch) full=true ;;
            pull_request) base="$PR_BASE" ;;
            *) base="$PUSH_BASE" ;;
          esac
          if [ "$full" = false ] \
             && { [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; }; then
            echo "No usable base ref ($base); running a full sweep."
            full=true
          fi

          files=""
          docs=true
          config=true
          build=true

          if [ "$full" = false ]; then
            changed() {
              git diff --name-only --diff-filter=ACMR "$base" HEAD -- "$@"
            }

            files=$(changed '*.cpp' '*.hpp' '*.h' \
                    | sed "s|^|$GITHUB_WORKSPACE/|" | tr '\n' ' ')

            # Docs are generated from include/ (Doxygen) and docs/ (Sphinx
            # sources + the Doxyfile template); nothing else affects them.
            docs=false
            if changed include docs | grep -q .; then docs=true; fi

            # The config parity check compares config_io.cpp, the JSON schema,
            # the annotated template and the checker itself. Editing any but the
            # first touches no C/C++ file, so they need their own trigger or the
            # check never sees the change that broke it.
            config=false
            if changed src/config_io.cpp schemas example-config.toml \
                       scripts/check_config_schema.py | grep -q .; then
              config=true
            fi

            # A linter's own configuration changes what it says about files the
            # diff does not touch, so it promotes the run to a full sweep. Left
            # as a changed-file lint it would lint nothing at all, the list
            # being empty.
            if changed .clang-tidy .clang-format .cpplint.cfg \
                       .cppcheck_suppressions.txt | grep -q .; then
              echo "A linter configuration moved; running a full sweep."
              full=true
              files=""
            fi

            # What build-and-test actually reads. No ctest entry reads
            # examples/ or scripts/, and lint-ideals is a binary rather than
            # part of the lint target, so a campaign archive, a harness edit or
            # a new ideal rebuilds nothing. coverage_badge.py is the one script
            # a build job runs, and it needs the instrumented build under it, so
            # it counts as a build input.
            build=false
            if changed src include test web cmake vendor .github \
                       CMakeLists.txt CMakePresets.json flake.nix flake.lock \
                       scripts/coverage_badge.py | grep -q .; then
              build=true
            fi
          fi

          # "heavy" gates the whole check job -- the Nix install, the caches and
          # the configure/lint/docs step: true when there is a C/C++ file to
          # lint, a docs input to rebuild, a config input to check, or a full
          # sweep to run. When none holds there is nothing to check and the job
          # is skipped outright.
          heavy=false
          if [ "$full" = true ] || [ -n "${files// /}" ] \
             || [ "$docs" = true ] || [ "$config" = true ]; then
            heavy=true
          fi

          emit full "$full"
          emit files "$files"
          emit docs "$docs"
          emit config "$config"
          emit build "$build"
          emit heavy "$heavy"

          # Pull requests run debug, release and tsan; a push to main runs gcc
          # and coverage.
          #
          # tsan is on pull requests because the failures it finds are invisible
          # to everything else: a data race passes ctest and returns the right
          # answer, so neither the test suite nor review is likely to see it.
          # Catching one on the merge commit means catching it after review, on
          # a branch nobody is looking at any more.
          #
          # It costs runner minutes and no wall clock: the matrix runs
          # concurrently and tsan finishes inside debug's time (182s against
          # 186s on the last warm-cache run), so a pull request waits as long as
          # it did.
          #
          # A push to main runs gcc and coverage. actions/checkout resolves a
          # pull_request event to refs/pull/N/merge, so the pull request already
          # built and tested the clang configurations over this exact merge
          # result; re-deriving them here was 18% of this repository's runner
          # minutes. gcc is the one configuration a pull request never sees, and
          # the goldens are pinned under clang, so it stays.
          #
          # coverage is on the push rather than the pull request for two
          # reasons. It is a second full build and test of a tree the other legs
          # have already tested, spent to re-measure a number that moves on a
          # minority of commits; and it is the only clang leg main runs, so its
          # third-party cache entry is the one every pull-request branch
          # inherits (see the cache step below). The cost is that a commit
          # moving coverage without regenerating docs/coverage.svg now fails on
          # main rather than on its own pull request -- run
          # `python scripts/coverage_badge.py` before merging anything that
          # moves the number. The entry stays inside this matrix rather than
          # taking a job of its own so the badge check reuses the work: its
          # build is the instrumented one and its ctest run is what writes the
          # profiles, leaving the check itself an export and a byte comparison.
          # Instrumenting the debug preset instead would have cost no CI job at
          # all, and was rejected because that preset is the one everybody
          # builds locally -- it would slow the daily loop and drop a .profraw
          # in whatever directory a binary was run from.
          debug='{"preset":"debug","build_dir":"build"}'
          release='{"preset":"release","build_dir":"build-release"}'
          gcc='{"preset":"debug","build_dir":"build","compiler":"gcc","cmake_args":"-DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++"}'
          tsan='{"preset":"tsan","build_dir":"build-tsan"}'
          coverage='{"preset":"coverage","build_dir":"build-coverage"}'
          case "$EVENT" in
            push) include="$gcc,$coverage" ;;
            # The manual trigger is the escape hatch, so it runs everything.
            workflow_dispatch) include="$debug,$gcc,$release,$tsan,$coverage" ;;
            *) include="$debug,$release,$tsan" ;;
          esac
          emit matrix "{\"include\":[$include]}"

          if [ "$build" != true ]; then
            echo "No build inputs changed; build-and-test will be skipped."
          fi

  check:
    needs: setup
    if: needs.setup.outputs.run == 'true' && needs.setup.outputs.heavy == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Cache FetchContent dependencies
        uses: actions/cache@v5
        with:
          path: build/_deps
          # The generator is part of the key: FetchContent subbuild caches bake
          # in the generator, so a Makefiles-era cache can't be restored into a
          # Ninja configure ("generator does not match").
          key: ${{ runner.os }}-check-deps-ninja-${{ hashFiles('cmake/dependencies.cmake') }}
          restore-keys: |
            ${{ runner.os }}-check-deps-ninja-

      # clang-tidy result cache (ctcache): keyed on each TU's preprocessed
      # content + the .clang-tidy config, so unchanged translation units skip
      # re-analysis across runs. A fresh key each run (immutable caches can't be
      # overwritten) with a rolling restore-keys prefix restores the previous
      # run's results; only changed TUs are re-analysed. This is what keeps the
      # nightly full-tree sweep (and large PRs) cheap.
      - name: Cache clang-tidy results
        uses: actions/cache@v5
        with:
          path: .ctcache
          key: ${{ runner.os }}-ctcache-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-ctcache-

      # A single dev shell for configure + format + lint + docs, so the Nix
      # flake is evaluated and the shell instantiated once rather than once per
      # step. GitHub log groups keep the per-phase output readable.
      - name: Configure, lint, format-check, build docs
        env:
          CMAKE_C_COMPILER_LAUNCHER: sccache
          CMAKE_CXX_COMPILER_LAUNCHER: sccache
          # ctcache stores clang-tidy results here, overriding the in-tree
          # default of <build-dir>/ctcache (see cmake/run_clang_tidy.cmake):
          # the build directory is configured fresh each run, so the cache has
          # to sit at a fixed workspace path for actions/cache to restore it.
          CTCACHE_DIR: ${{ github.workspace }}/.ctcache
          FULL_SWEEP: ${{ needs.setup.outputs.full }}
          CHANGED_FILES: ${{ needs.setup.outputs.files }}
          DOCS_CHANGED: ${{ needs.setup.outputs.docs }}
          CONFIG_CHANGED: ${{ needs.setup.outputs.config }}
        run: |
          nix develop --command bash -euo pipefail -c '
            args=(--preset debug)
            run_lint=true
            if [ "$FULL_SWEEP" != "true" ]; then
              if [ -n "${CHANGED_FILES// /}" ]; then
                list=$(echo "$CHANGED_FILES" | xargs | tr " " ";")
                args+=("-DCOUNTER_LINT_FILES_OVERRIDE=$list")
              else
                run_lint=false
              fi
            fi

            echo "::group::Configure"
            cmake "${args[@]}"
            echo "::endgroup::"

            echo "::group::Check formatting"
            cmake --build --preset debug --target format-ci
            echo "::endgroup::"

            if [ "$run_lint" = "true" ]; then
              echo "::group::Check linting"
              cmake --build --preset debug --target lint
              echo "::endgroup::"
            else
              echo "No C/C++ files changed; skipping lint."
              # The lint aggregate would have covered this. A schema- or
              # template-only change skips that but still needs checking.
              if [ "$CONFIG_CHANGED" = "true" ]; then
                echo "::group::Check config key parity"
                cmake --build --preset debug --target lint-config-schema
                echo "::endgroup::"
              fi
            fi

            if [ "$DOCS_CHANGED" = "true" ]; then
              echo "::group::Build docs"
              cmake --build --preset debug --target docs
              echo "::endgroup::"
            else
              echo "No docs inputs changed; skipping docs build."
            fi
          '

  # Skipped on the schedule: a scheduled run only reaches here over a commit
  # already on main, which its pull request built and tested under clang and
  # its push built and tested under gcc, over the same Nix-pinned toolchain and
  # the same seed-pinned tests.
  build-and-test:
    needs: setup
    if: >-
      needs.setup.outputs.run == 'true' && needs.setup.outputs.build == 'true'
      && github.event_name != 'schedule'
    runs-on: ubuntu-latest

    strategy:
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      # Spot, black and ganak are spawned as subprocesses and nothing links
      # against them, so their trees carry none of a preset's flags: every leg
      # of this matrix built a byte-equivalent copy and saved it under a key of
      # its own. COUNTER_THIRD_PARTY_DIR (see the root CMakeLists) points them
      # all at one directory outside any build tree, so the key drops the preset
      # and the four legs share one entry. Only the compiler stays in it --
      # Spot's ./configure is handed CXX= and nothing else.
      #
      # That is what makes a pull request's *first* run fast. Actions caches are
      # branch-scoped with a fallback to the default branch, and a push to main
      # runs gcc and coverage, so main warms exactly one clang entry and every
      # branch inherits it. Measured cold against warm on one branch: the four
      # legs went 1859s to 595s of runner time and 528s to 186s of wall clock,
      # all of it the ~181s each leg spent downloading, configuring and building
      # Spot.
      #
      # Only the *installed* halves are cached, never the source and object
      # trees ExternalProject leaves beside them. Each module guards its whole
      # ExternalProject_Add behind an `if(EXISTS <name>-stamp/<name>-done)`, so
      # a restored tree that carries the stamp and the install prefix is never
      # rebuilt and never reads the objects that produced it -- 3.2GB of build
      # tree for 530MB of output, in a repository whose 10GB Actions cache the
      # arm64 Docker matrix already shares. Storing both halves put the store
      # 25% over that limit, and the eviction that followed cost these entries
      # and nothing else: they are the largest objects in it and, being written
      # at the end of a job and read at the start of the next, always the
      # coldest. The downloaded archives stay: ganak.cmake and black.cmake guard
      # their downloads on the archive file rather than on a stamp, so dropping
      # those buys 230MB and re-fetches them every run.
      #
      # The static archives go too. Nothing links libspot.a -- cmake/install.cmake
      # excludes it from the image for the same reason -- and it dwarfs the
      # shared library beside it: 212MB to 137MB compressed over spot and ganak.
      #
      # `-v3` is in the key because the path list and the payload both moved,
      # and a restore has to miss rather than pull back a per-preset entry.
      - name: Cache third-party tools
        uses: actions/cache@v5
        with:
          path: |
            third-party
            !third-party/**/*_project
            !third-party/**/*_project/**
            !third-party/**/*_project-build
            !third-party/**/*_project-build/**
            !third-party/**/*.a
            !third-party/**/*.la
          key: ${{ runner.os }}-${{ matrix.compiler || 'clang' }}-third-party-ninja-v3-${{ hashFiles('cmake/spot.cmake', 'cmake/ganak.cmake', 'cmake/black.cmake') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.compiler || 'clang' }}-third-party-ninja-v3-

      # FetchContent's trees are compiled with the preset's own flags -- Eigen
      # and cpptrace go into the binaries -- so unlike the tools above these
      # cannot be shared and the key keeps the preset. The generator is part of
      # it too: FetchContent subbuild caches bake in the generator, so a
      # Makefiles-era cache cannot be restored into a Ninja configure
      # ("generator does not match").
      - name: Cache FetchContent dependencies
        uses: actions/cache@v5
        with:
          path: ${{ matrix.build_dir }}/_deps
          key: ${{ runner.os }}-${{ matrix.preset }}-${{ matrix.compiler || 'clang' }}-deps-ninja-v3-${{ hashFiles('cmake/dependencies.cmake') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.preset }}-${{ matrix.compiler || 'clang' }}-deps-ninja-v3-

      # Configure + build + test share one dev shell to amortise Nix flake
      # evaluation across the three phases.
      - name: Configure, build, test
        env:
          CMAKE_C_COMPILER_LAUNCHER: sccache
          CMAKE_CXX_COMPILER_LAUNCHER: sccache
        run: |
          nix develop --command bash -euo pipefail -c '
            echo "::group::Configure"
            cmake --preset ${{ matrix.preset }} ${{ matrix.cmake_args }} \
              -DCOUNTER_THIRD_PARTY_DIR="$GITHUB_WORKSPACE/third-party"
            echo "::endgroup::"

            echo "::group::Build"
            cmake --build --preset ${{ matrix.preset }}
            echo "::endgroup::"

            echo "::group::Test"
            ctest --preset ${{ matrix.preset }}
            echo "::endgroup::"

            # The badge is a committed file, so nothing makes it wrong except a
            # commit that moves the number and leaves it behind. --no-run reads
            # the profiles the ctest above wrote rather than measuring again.
            if [ "${{ matrix.preset }}" = "coverage" ]; then
              echo "::group::Coverage badge"
              python3 scripts/coverage_badge.py --check --no-run
              echo "::endgroup::"
            fi
          '
