name: Benchmark

# Nightly only, at 03:00 UTC. Absolute ns/iter is compared across runner
# instances, so this is advisory (fail-on-alert: false) and was never a merge
# gate -- it does not belong on the pull-request path.
on:
  schedule:
    - cron: "0 3 * * *"
  # Manual trigger for an on-demand benchmark run.
  workflow_dispatch:

env:
  SCCACHE_GHA_ENABLED: "true"

jobs:
  benchmark:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # comment-on-alert posts a PR review, which contents: write does not cover.
      pull-requests: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      # Staleness gate for the nightly schedule. The toolchain is pinned by the
      # Nix flake, so a scheduled run over a tree that has not moved since the
      # previous night re-measures the same binary on the same inputs -- adding
      # a runner-noise datapoint to the history for no signal. Manual dispatch
      # always runs.
      #
      # It is a step guarding the rest of this job rather than a job of its own
      # because a job bills a whole minute however long it runs, and this
      # decision takes a second: as a separate job it cost as much as the
      # benchmark it was deciding about.
      - name: Decide whether this run has anything to do
        id: gate
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          age=$(( $(date +%s) - $(git log -1 --format=%ct) ))
          # 25h of slack over the 24h cron so a slightly-late trigger still runs.
          if [ "$age" -lt 90000 ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "HEAD committed ${age}s ago; running the nightly benchmark."
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No commits in the last 25h; skipping the nightly benchmark."
          fi

      - name: Install Nix
        if: steps.gate.outputs.run == 'true'
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up sccache
        if: steps.gate.outputs.run == 'true'
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Cache third-party dependencies
        if: steps.gate.outputs.run == 'true'
        uses: actions/cache@v5
        with:
          # The installed halves only, pruned by the last step of this job --
          # see the same step in ci.yml for why the ExternalProject source and
          # object trees are excluded, why that cannot be done with `!`
          # patterns here, and why the key carries the flake, a version segment
          # and the repository name.
          path: |
            build-bench/third_party
            build-bench/_deps
          key: ${{ runner.os }}-${{ github.event.repository.name }}-bench-ninja-v3-${{ hashFiles('flake.lock', 'flake.nix', 'cmake/third_party.cmake', 'cmake/spot.cmake', 'cmake/ganak.cmake', 'cmake/black.cmake', 'bench/CMakeLists.txt', 'cmake/dependencies.cmake') }}
          restore-keys: |
            ${{ runner.os }}-${{ github.event.repository.name }}-bench-ninja-v3-

      # One dev shell for the build and both benchmark runs, so the binaries
      # run under the PATH and library environment they were built in.
      - name: Configure, build, run benchmarks
        if: steps.gate.outputs.run == 'true'
        env:
          CMAKE_C_COMPILER_LAUNCHER: sccache
          CMAKE_CXX_COMPILER_LAUNCHER: sccache
        run: |
          nix develop --command bash -euo pipefail -c '
            echo "::group::Configure"
            cmake --preset bench
            echo "::endgroup::"

            echo "::group::Build"
            cmake --build --preset bench --target peredur_bench
            echo "::endgroup::"

            echo "::group::Check regression assertions"
            ./build-bench/bench/peredur_bench --check-assertions
            echo "::endgroup::"

            echo "::group::Run benchmarks"
            ./build-bench/bench/peredur_bench \
              --benchmark_format=json \
              --benchmark_out=bench_results.json \
              --benchmark_time_unit=ns
            echo "::endgroup::"
          '

      # Before the results step rather than last, because github-action-benchmark
      # switches the checkout to gh-pages when it pushes, and the script would
      # not be there. Nothing after this reads the tree, and the cache's post
      # step saves what is left.
      - name: Prune the third-party tree before the cache saves it
        if: steps.gate.outputs.run == 'true'
        run: scripts/prune_third_party.sh build-bench/third_party

      - name: Store benchmark results
        if: steps.gate.outputs.run == 'true'
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: PEREDUR benchmarks
          tool: googlecpp
          output-file-path: bench_results.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: ${{ github.ref == 'refs/heads/main' }}
          alert-threshold: '150%'
          comment-on-alert: true
          # Absolute ns/iter is compared across runner instances, so host
          # contention alone moves every benchmark by more than the threshold.
          # Alert, but do not fail the build on it.
          fail-on-alert: false
          gh-pages-branch: gh-pages
          benchmark-data-dir-path: .
