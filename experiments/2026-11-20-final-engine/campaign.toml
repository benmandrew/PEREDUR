name = "2026-11-20-final-engine"
branch = "campaign/final-engine"
profile = "final-engine"
description = "Every paper arm on the final engine at one commit (sweep F: climb, twoway in exchange mode, maximality removal, novelty; blame on in every arm; the controller store gated at a 150 ms screen): base, random, random+climb, full, the four no-<f> and the four only-<f> on the small set and rad's cores, the ten nsga2-apportion arms on the sideways seeded corpus, and all twelve on rad (PLAN.md)."

# Seeds pair every arm of a (spec, seed) on one host: the small set and the
# cores av2 0-14, av3 15-29; the seeded corpus av2 0-2, av3 3-4; rad av2 0-4,
# av3 15-19, as 2026-11-18-fretish-exchange-rerun split them. Not launched:
# prepared on 20 Nov for the user to enqueue.
hosts = { av2 = "", av3 = "" }

build = "sh -c 'cmake --build build-release -j 8'"

# One tree per thread setting: configs-final-engine at 2 threads a run (the
# small set, rad's cores and the seeded corpus), configs-final-engine-large
# with no parallel line (threads are CPUs over jobs), and
# configs-final-engine-vent with full, base and random alone. random/ holds
# sweep F's base (random) and only-climb (random+climb).
configs = "sh -c 'G=\"python3 scripts/gen_configs.py --weakening off --weights 0.1 0.2 0.7 --termination individuals --max-individuals 1000 --generations 500 --population-size 100 --pin-vintage --sweeps F\"; $G --schemes nsga2-apportion --parallel 2 --out-dir experiments/configs-final-engine && $G --schemes random --levels base,only-climb --parallel 2 --out-dir experiments/configs-final-engine && $G --schemes nsga2-apportion --out-dir experiments/configs-final-engine-large && $G --schemes random --levels base,only-climb --out-dir experiments/configs-final-engine-large && $G --schemes nsga2-apportion --levels base,full --out-dir experiments/configs-final-engine-vent && $G --schemes random --levels base --out-dir experiments/configs-final-engine-vent'"

# CPU windows. Every phase names its host, seeds, CPUs and memory on one
# line, so a window moves with one substitution per host, for example
#   sed -i '/av2 = { cpus/ s/cpus = "0-29"/cpus = "0-15"/' campaign.toml
# and `jobs` must then shrink with it (CPUs over threads a run). CPUs 30-31
# stay free for the Ollama server on both hosts.

# Small set and rad's cores: 19 subjects x 12 arms x 15 seeds = 3,420 runs a
# host, 15 jobs x 2 threads. About 155 slot-h, 5.2 h a host (PLAN.md).
[[phases]]
name = "small-av2"
profile = "final-engine"
hosts = { av2 = "0-14" }
confine = { av2 = { cpus = "0-29", memory_max = "64G" } }
jobs = 15

[[phases]]
name = "small-av3"
profile = "final-engine"
hosts = { av3 = "15-29" }
confine = { av3 = { cpus = "0-29", memory_max = "64G" } }
jobs = 15

# The sideways seeded corpus: 130 subjects x 10 arms, 3 seeds on av2 (3,900
# runs) and 2 on av3 (2,600), 15 jobs x 2 threads. About 136 and 91 slot-h,
# 4.5 h and 3.0 h.
[[phases]]
name = "seeded-av2"
profile = "final-engine-seeded"
hosts = { av2 = "0-2" }
confine = { av2 = { cpus = "0-29", memory_max = "48G" } }
jobs = 15

[[phases]]
name = "seeded-av3"
profile = "final-engine-seeded"
hosts = { av3 = "3-4" }
confine = { av3 = { cpus = "0-29", memory_max = "48G" } }
jobs = 15

# rad: 12 arms x 5 seeds = 60 runs a host; 7 jobs over 30 CPUs give 4
# threads a run, as rad's earlier runs had. About 27 slot-h, 1-2 h a host.
[[phases]]
name = "rad-av2"
profile = "final-engine-large"
specs = ["rad"]
hosts = { av2 = "0-4" }
confine = { av2 = { cpus = "0-29", memory_max = "96G" } }
jobs = 7

[[phases]]
name = "rad-av3"
profile = "final-engine-large"
specs = ["rad"]
hosts = { av3 = "15-19" }
confine = { av3 = { cpus = "0-29", memory_max = "96G" } }
jobs = 7
