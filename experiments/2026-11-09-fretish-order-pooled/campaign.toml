name = "2026-11-09-fretish-order-pooled"
branch = "feat/fretish-order-pooled"
description = "Pooled strength and diversity of the FRETISH order arms: each only-<feature> arm and full against base under nsga2-apportion, over the 9 small specs and rad's 10 cores. Per host: a pool phase copies the committed pools of its subjects and pools its own cores from all 30 seeds, a fingerprint phase draws black lasso words over the members and plans the pairs design.toml needs, and a compare phase decides them. The reduction runs locally (PLAN.md)."

# Not seed-split: each host takes whole subjects (subjects-<host>.txt). Enqueued
# behind 2026-11-09-fretish-order-cores, so on each host it starts once that
# host's cores, every seed of them, are done.
hosts = { av2 = "", av3 = "" }

# fpdraw is EXCLUDE_FROM_ALL, so the build names it.
build = "sh -c 'cmake --build build-release && cmake --build build-release --target fpdraw'"

# A subject already in the committed pool (members/, built locally from both
# hosts' seeds) is copied byte for byte; a core is pooled from this host's
# results directory, and a missing or unfinished seed fails the phase. The
# output is under an ignored directory, so the checkout stays clean.
[[phases]]
name = "pool"
kind = "pool"
design = "experiments/2026-11-09-fretish-order-pooled/design.toml"
subjects = "experiments/2026-11-09-fretish-order-pooled/subjects-{host}.txt"
copy_from = "experiments/2026-11-09-fretish-order-pooled/members"
out = "experiments/fretish-order-pooled-v2-members"

# Draw 32768 words a subject over the members (black, 30 s a draw, 8 at a
# time), evaluate every node on them, and plan the pairs the design's
# contrasts need with a direction no word refutes: every such pair for an
# exhaustive subject, and 100 draws an arm for valu3s-uc6 and
# lift-plus-cruise-mini. Resumes per subject.
[[phases]]
name = "fingerprint"
kind = "fingerprint"
subjects = "experiments/2026-11-09-fretish-order-pooled/subjects-{host}.txt"
members = "experiments/fretish-order-pooled-v2-members"
design = "experiments/2026-11-09-fretish-order-pooled/design.toml"
work = "experiments/fretish-order-pooled-v2-work"
out = "experiments/fretish-order-pooled-v2/fp"
pairs = "experiments/fretish-order-pooled-v2-work/pairs-{host}.csv"
words = 32768
seed = 3
workers = 8
black_timeout = 30

# Every planned pair, each unrefuted direction at the archive's 20 s.
[[phases]]
name = "subsumption"
kind = "compare"
pairs = "experiments/fretish-order-pooled-v2-work/pairs-{host}.csv"
out = "experiments/fretish-order-pooled-v2/subsumption-{host}.csv"
jobs = 24
black_timeout = 20
wall_timeout = 180
vmem_kb = 8388608
