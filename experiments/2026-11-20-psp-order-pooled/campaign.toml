name = "2026-11-20-psp-order-pooled"
branch = "campaign/psp-order"
description = "Pooled pass over 2026-11-20-psp-order: sweep F's base, full and every no-<f>, on the PSP specifications (30 seeds) and the PSP seeded corpus (5 seeds), less any subject where an arm holds 3 or fewer members, every pair of arms planned, for accepted-trace share, net containment at K = 3 with seed-half controls, and joint-front reach with each arm's odd-against-even control."

# The runs' seeds are split over av2 and av3, so the pool is built locally
# after `collect`, then copied with the design and subject lists (untracked,
# written by 2026-11-20-psp-order-pooled/scripts/make_design.py) to each
# host's checkout by rsync before enqueue (2026-11-20-psp-order PLAN.md).
hosts = { av2 = "", av3 = "" }

# CPU windows. Every phase names its host, seeds, CPUs and memory on one
# line, so a window moves with one substitution per host, for example
#   sed -i '/av2 = { cpus/ s/cpus = "0-29"/cpus = "0-15"/' campaign.toml
# and `jobs` must then shrink with it (CPUs over threads a run). CPUs 30-31
# stay free for the Ollama server on both hosts.
confine = { av2 = { cpus = "0-29", memory_max = "64G" }, av3 = { cpus = "0-29", memory_max = "64G" } }

# fpdraw is EXCLUDE_FROM_ALL, so the build names it. `confine` does not reach
# the build, so taskset holds it to the same CPUs.
build = "sh -c 'taskset -c 0-29 sh -c \"cmake --build build-release -j 16 && cmake --build build-release -j 16 --target fpdraw\"'"

# Estimate: about 50 subjects with six arms each, most a few hundred nodes
# after pooling, so compare is small (5-10 call-h) and the fingerprint draws
# dominate (10-30 CPU-h): 1-2 h a host (+-50%; no earlier PSP pass).

# Every subject is in the copied pool, so this phase only copies it, after
# checking each file against its index row.
[[phases]]
name = "pool"
kind = "pool"
design = "experiments/2026-11-20-psp-order-pooled/design.toml"
subjects = "experiments/2026-11-20-psp-order-pooled/subjects-{host}.txt"
copy_from = "experiments/2026-11-20-psp-order-pooled/members"
out = "experiments/psp-order-pooled-members"

# 32768 words a subject (black, 30 s a draw, 8 at a time), every node
# evaluated on them, and every pair the design plans: every pair of the six
# arms is a contrast.
[[phases]]
name = "fingerprint"
kind = "fingerprint"
subjects = "experiments/2026-11-20-psp-order-pooled/subjects-{host}.txt"
members = "experiments/psp-order-pooled-members"
design = "experiments/2026-11-20-psp-order-pooled/design.toml"
work = "experiments/psp-order-pooled-work"
out = "experiments/psp-order-pooled/fp"
pairs = "experiments/psp-order-pooled-work/pairs-{host}.csv"
words = 32768
seed = 3
workers = 8
black_timeout = 30

# Each unrefuted direction at the archive's 20 s, 12 jobs as the earlier
# pooled passes ran, so a 20 s comparison is not timed out by contention.
[[phases]]
name = "compare"
kind = "compare"
pairs = "experiments/psp-order-pooled-work/pairs-{host}.csv"
out = "experiments/psp-order-pooled/subsumption-{host}.csv"
jobs = 12
black_timeout = 20
wall_timeout = 180
vmem_kb = 8388608

# On av2 alone, once av3's entry has passed its compare phase: gather both
# hosts' outputs, then pooled_reduce.py (strength, and pooled ball radii at
# K = 3 with each arm's seed-half control) and joint_measures.py (share,
# joint-front reach, and each arm's odd-against-even reach control). av3
# cannot ssh to av2, so av2 gathers.
[[phases]]
name = "reduce"
kind = "reduce"
host = "av2"
design = "experiments/2026-11-20-psp-order-pooled/design.toml"
members = "experiments/2026-11-20-psp-order-pooled/members"
outputs = "experiments/psp-order-pooled"
collected = "experiments/psp-order-pooled-collected"
out = "experiments/psp-order-pooled-reduced"
confine = { av2 = { cpus = "0-29", memory_max = "96G" } }
jobs = 4
pooled_balls = true
ball_k = [3]
joint = true
half_control = true
