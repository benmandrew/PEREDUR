name = "2026-11-25-one-way-pooled"
branch = "campaign/final-engine"
description = "Pooled pass on the paper's 8 nsga2-apportion arms after two-way mutation was dropped (2026-11-24-one-way PLAN.md): base and only-<f> from sweep F, full from sweep F's no-gate, no-<f> from sweep T, 30 seeds, on the 18 subjects of 2026-11-20-final-engine-pooled, every pair of arms planned, for accepted-trace share, net containment at K = 3 with seed-half controls, and joint-front reach with each arm's odd-against-even control."

# The runs' seeds are split over av2 and av3, so the pool is built locally
# after `collect`, then copied with the design and subject lists (untracked,
# written by 2026-11-25-one-way-pooled/scripts/make_design.py) to each
# host's checkout by rsync before enqueue (2026-11-24-one-way PLAN.md).
hosts = { av2 = "", av3 = "" }

# CPU windows. Every phase names its host, seeds, CPUs and memory on one
# line, so a window moves with one substitution per host, for example
#   sed -i '/av2 = { cpus/ s/cpus = "0-29"/cpus = "0-15"/' campaign.toml
# and `jobs` must then shrink with it (CPUs over threads a run). CPUs 30-31
# stay free for the Ollama server on both hosts.
# CPUs 0-29 on both hosts (2026-11-25): nothing else is planned there.
confine = { av2 = { cpus = "0-29", memory_max = "96G" }, av3 = { cpus = "0-29", memory_max = "96G" } }

# fpdraw is EXCLUDE_FROM_ALL, so the build names it. `confine` does not reach
# the build, so taskset holds it to the same CPUs.
build = "sh -c 'taskset -c 0-29 sh -c \"cmake --build build-release -j 24 && cmake --build build-release -j 24 --target fpdraw\"'"

# Estimate: the ten-arm pass (45 contrasts, 235,515 nodes) took about 5 h a host on CPUs 0-13; 8 arms give 28 contrasts and fewer nodes, on twice the CPUs, so about 1.5-3 h a host (+-50%).

# Every subject is in the copied pool, so this phase only copies it, after
# checking each file against its index row.
[[phases]]
name = "pool"
kind = "pool"
design = "experiments/2026-11-25-one-way-pooled/design.toml"
subjects = "experiments/2026-11-25-one-way-pooled/subjects-{host}.txt"
copy_from = "experiments/2026-11-25-one-way-pooled/members"
out = "experiments/one-way-pooled-members"

# 32768 words a subject (black, 30 s a draw, 16 at a time), every node
# evaluated on them, and every pair the design plans: every pair of the 8
# arms is a contrast.
[[phases]]
name = "fingerprint"
kind = "fingerprint"
subjects = "experiments/2026-11-25-one-way-pooled/subjects-{host}.txt"
members = "experiments/one-way-pooled-members"
design = "experiments/2026-11-25-one-way-pooled/design.toml"
work = "experiments/one-way-pooled-work"
out = "experiments/one-way-pooled/fp"
pairs = "experiments/one-way-pooled-work/pairs-{host}.csv"
words = 32768
seed = 3
workers = 16
black_timeout = 30

# Each unrefuted direction at the archive's 20 s, 24 jobs on twice the CPUs of the earlier
# pooled passes ran, so a 20 s comparison is not timed out by contention.
[[phases]]
name = "compare"
kind = "compare"
pairs = "experiments/one-way-pooled-work/pairs-{host}.csv"
out = "experiments/one-way-pooled/subsumption-{host}.csv"
jobs = 24
black_timeout = 20
wall_timeout = 180
vmem_kb = 8388608

# On av2 alone, once av3's entry has passed its compare phase: gather both
# hosts' outputs, then pooled_reduce.py (strength, and pooled ball radii at
# K = 3 with each arm's seed-half control) and joint_measures.py (share,
# joint-front reach, and each arm's odd-against-even reach control). av3
# cannot ssh to av2, so av2 gathers.
[[phases]]
name = "reduce"
kind = "reduce"
host = "av2"
design = "experiments/2026-11-25-one-way-pooled/design.toml"
members = "experiments/2026-11-25-one-way-pooled/members"
outputs = "experiments/one-way-pooled"
collected = "experiments/one-way-pooled-collected"
out = "experiments/one-way-pooled-reduced"
confine = { av2 = { cpus = "0-29", memory_max = "96G" } }
jobs = 6
pooled_balls = true
ball_k = [3]
joint = true
half_control = true
