# Catalogue of the result sets under experiments/ and the papers they serve.
#
# The results stay at the paths their tools wrote: campaign.py, the av2 and
# av3 mirrors and the papers' import scripts find them by name. This file says
# what each set is. `scripts/catalogue.py check` fails on an entry of
# experiments/ that no set claims, and `render` writes CATALOGUE.md.
#
# Per set:
#   name           unique; usually the campaign or the set's main path
#   paths          entries of experiments/ (or of `location`) that make it up
#   location       where the set lives when it is not this checkout's
#                  experiments/: another checkout, or "av2, av3: <dir>"
#   paper          ext, tlsf or none
#   status         cited | supporting | superseded | pilot | development | inputs
#   superseded_by  the set that replaced it, when status = "superseded"
#   question       the paper's research question or section it serves
#   campaign       the campaign that produced it
#   date, commits, purpose, note

[paper.ext]
title = "FRETISH order-directed search (the extension paper)"
repo = "~/projects/writing/peredur-extension"
note = "`make import` (`scripts/import_data.py`) copies or reduces each cited set into the paper's `data/`; the research questions are those of `2026-11-05-fretish-order/PLAN.md`."

[paper.tlsf]
title = "TLSF repair against AuRUS (the TLSF paper, peredur2027)"
repo = "~/projects/writing/peredur-paper"
note = "The paper's `data/*/PROVENANCE*.txt` name every input. Its cited sets were written while this repository was called counter, so on av2 and av3 they sit under `~/projects/counter/experiments`."

