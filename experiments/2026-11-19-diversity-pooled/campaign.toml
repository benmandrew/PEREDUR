name = "2026-11-19-diversity-pooled"
branch = "campaign/diversity-climb"
description = "Pooled pass over 2026-11-19-diversity-screen-blame: the paper's full at climb_orders 4 and 1 (full-k4, full-k1) and four screen arms (novelty, slot-coverage, flip-tabu, flip-sideways), 30 seeds each, over the small set less fsm-lmcps and rad's 10 cores, for accepted-trace share, net containment at K = 3 with seed-half controls, and joint-front reach (PLAN.md). More arms join by lines in design.toml."

# Each host fingerprints and compares its own subjects. The pool was built
# locally, since the climb arms' seeds are split over av2 and av3. The pool,
# design and subject lists are ignored files, copied to each host's checkout
# by rsync before enqueue (PLAN.md).
hosts = { av2 = "", av3 = "" }

# CPUs 0-13 and 28G on both hosts: veribee-d3's hunt holds CPUs 14-31 on av2
# and av3 until about 22 Nov. Every phase inherits this table.
confine = { av2 = { cpus = "0-13", memory_max = "28G" }, av3 = { cpus = "0-13", memory_max = "28G" } }

# fpdraw is EXCLUDE_FROM_ALL, so the build names it. `confine` does not reach
# the build, so taskset holds it to the same CPUs.
build = "sh -c 'taskset -c 0-13 sh -c \"cmake --build build-release -j 12 && cmake --build build-release -j 12 --target fpdraw\"'"

# v2: the pool of six arms. The first draft's two-arm pool never ran; the -v2
# paths keep any output of it apart all the same.

# Every subject is in the copied pool, so this phase only copies it, after
# checking each file against its index row.
[[phases]]
name = "pool"
kind = "pool"
design = "experiments/2026-11-19-diversity-pooled/design.toml"
subjects = "experiments/2026-11-19-diversity-pooled/subjects-{host}.txt"
copy_from = "experiments/2026-11-19-diversity-pooled/members"
out = "experiments/diversity-pooled-v2-members"

# 32768 words a subject over the members (black, 30 s a draw, 6 at a time),
# every node evaluated on them, and the pairs the design plans. Every pair of
# the six arms is a contrast, so every node pair no word refutes is kept.
[[phases]]
name = "fingerprint"
kind = "fingerprint"
subjects = "experiments/2026-11-19-diversity-pooled/subjects-{host}.txt"
members = "experiments/diversity-pooled-v2-members"
design = "experiments/2026-11-19-diversity-pooled/design.toml"
work = "experiments/diversity-pooled-v2-work"
out = "experiments/diversity-pooled-v2/fp"
pairs = "experiments/diversity-pooled-v2-work/pairs-{host}.csv"
words = 32768
seed = 3
workers = 6
black_timeout = 30

# Every planned pair, each unrefuted direction at the archive's 20 s, 10 jobs
# on the 14 CPUs.
[[phases]]
name = "compare"
kind = "compare"
pairs = "experiments/diversity-pooled-v2-work/pairs-{host}.csv"
out = "experiments/diversity-pooled-v2/subsumption-{host}.csv"
jobs = 10
black_timeout = 20
wall_timeout = 180
vmem_kb = 8388608
