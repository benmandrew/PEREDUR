name = "2026-11-27-extra-seeded-random-pooled"
branch = "campaign/final-engine"
description = "Pooled pass of random/base against nsga2-apportion/base on the seeded fsm-lmcps mutants paper-v2 m01, m02, m07 and m09 at seeds 0-29 (2026-11-27-seeded-random-extra), on the 8-arm passes' words (m01, m02, m07 from 2026-11-26-extra-seeded-pooled, m09 from 2026-11-27-extra-m09-pooled), copied into this pass's fp directory before enqueue, so fingerprint draws none. Its rows join 2026-11-27-seeded-random-pooled at import, so random's seeded pool covers the Pareto arms' mutants (user, 2026-11-27)."

# The pool is built locally, then copied with the design and subject list
# (untracked, written by 2026-11-27-seeded-random-extra/scripts/make_design.py)
# to av2's checkout by rsync before enqueue, with each mutant's words and
# words.meta copied into experiments/extra-seeded-random-pooled/fp/<subject>/:
# m01 and m07 from av2's extra-seeded-pooled/fp, m02 from av3's, m09 from
# extra-m09-pooled/fp once that pass's fingerprint phase is done.
# av2 alone: the GAWAIN session holds av3 (2026-11-27).
hosts = { av2 = "" }

# CPUs 0-29; 30-31 stay free for the Ollama server.
confine = { av2 = { cpus = "0-29", memory_max = "96G" } }

# fpdraw is EXCLUDE_FROM_ALL, so the build names it. `confine` does not reach
# the build, so taskset holds it to the same CPUs.
build = "sh -c 'taskset -c 0-29 sh -c \"cmake --build build-release -j 24 && cmake --build build-release -j 24 --target fpdraw\"'"

# Estimate: 4 subjects, 2 arms, 1 contrast; under 20 min.

# Every subject is in the copied pool, so this phase only copies it, after
# checking each file against its index row.
[[phases]]
name = "pool"
kind = "pool"
design = "experiments/2026-11-27-extra-seeded-random-pooled/design.toml"
subjects = "experiments/2026-11-27-extra-seeded-random-pooled/subjects-{host}.txt"
copy_from = "experiments/2026-11-27-extra-seeded-random-pooled/members"
out = "experiments/extra-seeded-random-pooled-members"

# The seeded 8-arm pass's 32768 words a subject, copied in, so draw_black.py does
# not run; every node evaluated on them, and every pair the design plans.
[[phases]]
name = "fingerprint"
kind = "fingerprint"
subjects = "experiments/2026-11-27-extra-seeded-random-pooled/subjects-{host}.txt"
members = "experiments/extra-seeded-random-pooled-members"
design = "experiments/2026-11-27-extra-seeded-random-pooled/design.toml"
work = "experiments/extra-seeded-random-pooled-work"
out = "experiments/extra-seeded-random-pooled/fp"
pairs = "experiments/extra-seeded-random-pooled-work/pairs-{host}.csv"
words = 32768
seed = 3
workers = 16
black_timeout = 30

# Each unrefuted direction at the archive's 20 s, 24 jobs on twice the CPUs of the earlier
# pooled passes ran, so a 20 s comparison is not timed out by contention.
[[phases]]
name = "compare"
kind = "compare"
pairs = "experiments/extra-seeded-random-pooled-work/pairs-{host}.csv"
out = "experiments/extra-seeded-random-pooled/subsumption-{host}.csv"
jobs = 24
black_timeout = 20
wall_timeout = 180
vmem_kb = 8388608

# On av2: pooled_reduce.py (strength, and pooled ball radii at K = 3 with
# each arm's seed-half control) and joint_measures.py (share, joint-front
# reach, and each arm's odd-against-even reach control).
[[phases]]
name = "reduce"
kind = "reduce"
host = "av2"
design = "experiments/2026-11-27-extra-seeded-random-pooled/design.toml"
members = "experiments/2026-11-27-extra-seeded-random-pooled/members"
outputs = "experiments/extra-seeded-random-pooled"
collected = "experiments/extra-seeded-random-pooled-collected"
out = "experiments/extra-seeded-random-pooled-reduced"
confine = { av2 = { cpus = "0-29", memory_max = "96G" } }
jobs = 6
pooled_balls = true
ball_k = [3]
joint = true
half_control = true
