name = "2026-11-09-fretish-order-pooled-calib"
branch = "feat/fretish-order-pooled"
description = "Calibration for 2026-11-09-fretish-order-pooled: the same two phases on fsm-timing alone, on av2, to measure the planned directions, the undecided share at 20 s and the call-seconds a direction before the main pass is split between hosts."

# One host, one subject. It reads the main pass's design and members, so the
# plan it measures is the one the main pass will run.
hosts = { av2 = "" }

build = "sh -c 'cmake --build build-release && cmake --build build-release --target fpdraw'"

[[phases]]
name = "fingerprint"
kind = "fingerprint"
subjects = "experiments/2026-11-09-fretish-order-pooled-calib/subjects.txt"
members = "experiments/2026-11-09-fretish-order-pooled/members"
design = "experiments/2026-11-09-fretish-order-pooled/design.toml"
work = "experiments/fretish-order-pooled-calib-work"
out = "experiments/fretish-order-pooled-calib/fp"
pairs = "experiments/fretish-order-pooled-calib-work/pairs-{host}.csv"
words = 32768
seed = 3
workers = 8
black_timeout = 30

[[phases]]
name = "subsumption"
kind = "compare"
pairs = "experiments/fretish-order-pooled-calib-work/pairs-{host}.csv"
out = "experiments/fretish-order-pooled-calib/subsumption-{host}.csv"
jobs = 24
black_timeout = 20
wall_timeout = 180
vmem_kb = 8388608
