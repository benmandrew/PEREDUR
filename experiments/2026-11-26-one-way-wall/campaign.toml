name = "2026-11-26-one-way-wall"
branch = "campaign/final-engine"
profile = "one-way-wall"
description = "Sweep T's full, no-climb, no-remove and no-novelty in one campaign on the small set (30 seeds) and rad (10 seeds), at sweep F's host split and load, so the leave-one-out wall time pairs within one campaign (user, 2026-11-26). Repairs should match sweeps F and T byte for byte (PLAN.md)."

# Seeds as sweep F: the small set av2 0-14, av3 15-29; rad av2 0-4, av3 15-19.
hosts = { av2 = "", av3 = "" }

build = "sh -c 'cmake --build build-release -j 8'"

configs = "sh -c 'G=\"python3 scripts/gen_configs.py --weakening off --weights 0.1 0.2 0.7 --termination individuals --max-individuals 1000 --generations 500 --population-size 100 --pin-vintage --sweeps T --schemes nsga2-apportion\"; $G --parallel 2 --out-dir experiments/configs-one-way && $G --out-dir experiments/configs-one-way-large'"

# Small set: 9 specs x 4 arms x 15 seeds = 540 runs a host, 7 jobs x 2
# threads on CPUs 0-13, as sweep F's small phases ran. About 22 slot-h, 3.2 h
# a host. CPUs 14-31 stay idle so the load matches sweep F's as closely as an
# idle host allows.
[[phases]]
name = "small-av2"
profile = "one-way-wall"
hosts = { av2 = "0-14" }
confine = { av2 = { cpus = "0-13", memory_max = "28G" } }
jobs = 7

[[phases]]
name = "small-av3"
profile = "one-way-wall"
hosts = { av3 = "15-29" }
confine = { av3 = { cpus = "0-13", memory_max = "28G" } }
jobs = 7

# rad: 4 arms x 5 seeds = 20 runs a host, 7 jobs x 4 threads on CPUs 0-29,
# as sweep F's rad phases ran. About 1 slot-h, 15-20 min a host.
[[phases]]
name = "rad-av2"
profile = "one-way-wall-large"
specs = ["rad"]
hosts = { av2 = "0-4" }
confine = { av2 = { cpus = "0-29", memory_max = "96G" } }
jobs = 7

[[phases]]
name = "rad-av3"
profile = "one-way-wall-large"
specs = ["rad"]
hosts = { av3 = "15-19" }
confine = { av3 = { cpus = "0-29", memory_max = "96G" } }
jobs = 7
