name = "2026-11-27-seeded-random-pooled"
branch = "campaign/final-engine"
description = "Pooled pass over the sideways seeded corpus: sweep F's random/base (2026-11-27-seeded-random) against nsga2-apportion/base (sweep F), seeds 0-4, on the 126 subjects, host split and word sample of 2026-11-25-one-way-seeded-pooled (each subject's words and words.meta copied into this pass's fp directory before enqueue, so fingerprint draws none), for strength, pooled balls at K = 3 with seed-half controls, and accepted-trace share of random against base. Joint-front reach here is over two arms and is not the paper's measure. The three fsm-lmcps mutants of 2026-11-26-extra-seeded-pooled stay out: random ran at seeds 0-4 only, where no arm repairs them."

# The pool is built locally, then copied with the design and subject lists
# (untracked, written by 2026-11-25-one-way-pooled/scripts/make_design.py
# random) to each host's checkout by rsync before enqueue, with the words of
# experiments/one-way-seeded-pooled/fp/<subject>/ copied on each host into
# experiments/seeded-random-pooled/fp/<subject>/ (PLAN.md).
hosts = { av2 = "", av3 = "" }

# CPU windows. Every phase names its host, seeds, CPUs and memory on one
# line, so a window moves with one substitution per host, for example
#   sed -i '/av2 = { cpus/ s/cpus = "0-29"/cpus = "0-15"/' campaign.toml
# and `jobs` must then shrink with it (CPUs over threads a run). CPUs 30-31
# stay free for the Ollama server on both hosts.
# CPUs 0-29 on both hosts (2026-11-25): nothing else is planned there.
confine = { av2 = { cpus = "0-29", memory_max = "96G" }, av3 = { cpus = "0-29", memory_max = "96G" } }

# fpdraw is EXCLUDE_FROM_ALL, so the build names it. `confine` does not reach
# the build, so taskset holds it to the same CPUs.
build = "sh -c 'taskset -c 0-29 sh -c \"cmake --build build-release -j 24 && cmake --build build-release -j 24 --target fpdraw\"'"

# Estimate: the 8-arm seeded pass was estimated at 1.5-2.5 h a host for 28
# contrasts, with fingerprint drawing its words; this pass draws none and
# plans 1 contrast over 2 arms, so well under an hour a host.

# Every subject is in the copied pool, so this phase only copies it, after
# checking each file against its index row.
[[phases]]
name = "pool"
kind = "pool"
design = "experiments/2026-11-27-seeded-random-pooled/design.toml"
subjects = "experiments/2026-11-27-seeded-random-pooled/subjects-{host}.txt"
copy_from = "experiments/2026-11-27-seeded-random-pooled/members"
out = "experiments/seeded-random-pooled-members"

# The seeded 8-arm pass's 32768 words a subject, copied in, so draw_black.py does
# not run; every node evaluated on them, and every pair the design plans.
[[phases]]
name = "fingerprint"
kind = "fingerprint"
subjects = "experiments/2026-11-27-seeded-random-pooled/subjects-{host}.txt"
members = "experiments/seeded-random-pooled-members"
design = "experiments/2026-11-27-seeded-random-pooled/design.toml"
work = "experiments/seeded-random-pooled-work"
out = "experiments/seeded-random-pooled/fp"
pairs = "experiments/seeded-random-pooled-work/pairs-{host}.csv"
words = 32768
seed = 3
workers = 16
black_timeout = 30

# Each unrefuted direction at the archive's 20 s, 24 jobs on twice the CPUs of the earlier
# pooled passes ran, so a 20 s comparison is not timed out by contention.
[[phases]]
name = "compare"
kind = "compare"
pairs = "experiments/seeded-random-pooled-work/pairs-{host}.csv"
out = "experiments/seeded-random-pooled/subsumption-{host}.csv"
jobs = 24
black_timeout = 20
wall_timeout = 180
vmem_kb = 8388608

# On av2 alone, once av3's entry has passed its compare phase: gather both
# hosts' outputs, then pooled_reduce.py (strength, and pooled ball radii at
# K = 3 with each arm's seed-half control) and joint_measures.py (share,
# joint-front reach, and each arm's odd-against-even reach control). av3
# cannot ssh to av2, so av2 gathers.
[[phases]]
name = "reduce"
kind = "reduce"
host = "av2"
design = "experiments/2026-11-27-seeded-random-pooled/design.toml"
members = "experiments/2026-11-27-seeded-random-pooled/members"
outputs = "experiments/seeded-random-pooled"
collected = "experiments/seeded-random-pooled-collected"
out = "experiments/seeded-random-pooled-reduced"
confine = { av2 = { cpus = "0-29", memory_max = "96G" } }
jobs = 6
pooled_balls = true
ball_k = [3]
joint = true
half_control = true
