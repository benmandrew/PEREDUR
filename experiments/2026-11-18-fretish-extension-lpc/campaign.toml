name = "2026-11-18-fretish-extension-lpc"
branch = "campaign/fretish-extension-share"
profile = "fretish-order-large-full4"
description = "The new ablation's 9 arms on lift-plus-cruise-full, 2 seeds per host plus one stretch seed, on whole hosts from 06:00 on 18 Nov (2026-11-17-fretish-extension-share/PLAN.md)."

# Enqueued once veribee-ab releases its halves at 06:00. CPUs 30-31 stay free
# for peredur-extension-55. 3 jobs over 30 CPUs give 10 threads a run, as
# base's lift-plus-cruise-full runs had. Seeds pair with base's hosts.
hosts = { av2 = "", av3 = "" }

build = "sh -c 'cmake --build build-release'"

configs = "sh -c 'G=\"python3 scripts/gen_configs.py --schemes nsga2-apportion --weakening off --weights 0.1 0.2 0.7 --termination individuals --max-individuals 1000 --generations 500 --population-size 100 --pin-vintage\"; $G --sweeps D --parallel 2 --out-dir experiments/configs-fretish-seeded-full4 && $G --sweeps D O --out-dir experiments/configs-fretish-order-large-full4'"

# 9 arms x 2 seeds, less the night phase's 5 runs: 13 runs per host.
[[phases]]
name = "lpc-av2"
specs = ["lift-plus-cruise-full"]
hosts = { av2 = "0-1" }
confine = { av2 = { cpus = "0-29", memory_max = "110G" } }
jobs = 3

[[phases]]
name = "lpc-av3"
specs = ["lift-plus-cruise-full"]
hosts = { av3 = "15-16" }
confine = { av3 = { cpus = "0-29", memory_max = "110G" } }
jobs = 3

# Stretch: one more seed per host. Dequeue at 12:00 if its 9 arms have not
# all finished; a seed short of an arm is dropped from the contrasts.
[[phases]]
name = "lpc-stretch-av2"
specs = ["lift-plus-cruise-full"]
hosts = { av2 = "2" }
confine = { av2 = { cpus = "0-29", memory_max = "110G" } }
jobs = 3

[[phases]]
name = "lpc-stretch-av3"
specs = ["lift-plus-cruise-full"]
hosts = { av3 = "17" }
confine = { av3 = { cpus = "0-29", memory_max = "110G" } }
jobs = 3
