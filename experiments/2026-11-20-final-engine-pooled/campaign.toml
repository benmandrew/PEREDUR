name = "2026-11-20-final-engine-pooled"
branch = "campaign/final-engine"
description = "Pooled pass over 2026-11-20-final-engine: sweep F's ten nsga2-apportion arms (base, full, every no-<f>, every only-<f>), 30 seeds, on the 18 subjects of 2026-11-19-fretish-exchange-pooled (the small set less fsm-lmcps, and rad's 10 cores), every pair of arms planned, for accepted-trace share, net containment at K = 3 with seed-half controls, and joint-front reach with each arm's odd-against-even control."

# The runs' seeds are split over av2 and av3, so the pool is built locally
# after `collect`, then copied with the design and subject lists (untracked,
# written by 2026-11-20-final-engine-pooled/scripts/make_design.py) to each
# host's checkout by rsync before enqueue (2026-11-20-final-engine PLAN.md).
hosts = { av2 = "", av3 = "" }

# CPU windows. Every phase names its host, seeds, CPUs and memory on one
# line, so a window moves with one substitution per host, for example
#   sed -i '/av2 = { cpus/ s/cpus = "0-29"/cpus = "0-15"/' campaign.toml
# and `jobs` must then shrink with it (CPUs over threads a run). CPUs 30-31
# stay free for the Ollama server on both hosts.
confine = { av2 = { cpus = "0-29", memory_max = "64G" }, av3 = { cpus = "0-29", memory_max = "64G" } }

# fpdraw is EXCLUDE_FROM_ALL, so the build names it. `confine` does not reach
# the build, so taskset holds it to the same CPUs.
build = "sh -c 'taskset -c 0-29 sh -c \"cmake --build build-release -j 16 && cmake --build build-release -j 16 --target fpdraw\"'"

# Estimate: the exchange pooled pass (7 arms) spent 12.7 call-h in compare over 1.95 M rows; ten arms give about 1.4x the nodes and 2x the pairs, so about 25 call-h of compare and 10 CPU-h of fingerprints, 2-4 h a host with the large cores as the tail (+-50%).

# Every subject is in the copied pool, so this phase only copies it, after
# checking each file against its index row.
[[phases]]
name = "pool"
kind = "pool"
design = "experiments/2026-11-20-final-engine-pooled/design.toml"
subjects = "experiments/2026-11-20-final-engine-pooled/subjects-{host}.txt"
copy_from = "experiments/2026-11-20-final-engine-pooled/members"
out = "experiments/final-engine-pooled-members"

# 32768 words a subject (black, 30 s a draw, 8 at a time), every node
# evaluated on them, and every pair the design plans: every pair of the ten
# arms is a contrast.
[[phases]]
name = "fingerprint"
kind = "fingerprint"
subjects = "experiments/2026-11-20-final-engine-pooled/subjects-{host}.txt"
members = "experiments/final-engine-pooled-members"
design = "experiments/2026-11-20-final-engine-pooled/design.toml"
work = "experiments/final-engine-pooled-work"
out = "experiments/final-engine-pooled/fp"
pairs = "experiments/final-engine-pooled-work/pairs-{host}.csv"
words = 32768
seed = 3
workers = 8
black_timeout = 30

# Each unrefuted direction at the archive's 20 s, 12 jobs as the earlier
# pooled passes ran, so a 20 s comparison is not timed out by contention.
[[phases]]
name = "compare"
kind = "compare"
pairs = "experiments/final-engine-pooled-work/pairs-{host}.csv"
out = "experiments/final-engine-pooled/subsumption-{host}.csv"
jobs = 12
black_timeout = 20
wall_timeout = 180
vmem_kb = 8388608

# On av2 alone, once av3's entry has passed its compare phase: gather both
# hosts' outputs, then pooled_reduce.py (strength, and pooled ball radii at
# K = 3 with each arm's seed-half control) and joint_measures.py (share,
# joint-front reach, and each arm's odd-against-even reach control). av3
# cannot ssh to av2, so av2 gathers.
[[phases]]
name = "reduce"
kind = "reduce"
host = "av2"
design = "experiments/2026-11-20-final-engine-pooled/design.toml"
members = "experiments/2026-11-20-final-engine-pooled/members"
outputs = "experiments/final-engine-pooled"
collected = "experiments/final-engine-pooled-collected"
out = "experiments/final-engine-pooled-reduced"
confine = { av2 = { cpus = "0-29", memory_max = "96G" } }
jobs = 4
pooled_balls = true
ball_k = [3]
joint = true
half_control = true
