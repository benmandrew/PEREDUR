name = "2026-11-17-fretish-order-remove-no-f-pooled"
branch = "campaign/fretish-order-remove-no-f-pooled"
description = "The paper's run (4) once removal replaced demotion: pooled pass of remove-full against remove-no-climb, remove-no-gate and remove-no-blame over the small set and rad's 10 cores, for accepted-trace share and net containment at K = 3 (PLAN.md)."

# Each host pools its own subjects. The pool, design and subject lists are
# ignored files, copied to each host's checkout by rsync before enqueue
# (PLAN.md).
hosts = { av2 = "", av3 = "" }

# av2 CPUs 0-15 and av3 CPUs 16-27, approved by the user on 18 Nov. It
# queues behind peredur-extension-26's 2026-11-18-fretish-extension-lpc
# (av2 088, av3 085). Every phase, and the build, stays on these CPUs.
confine = { av2 = { cpus = "0-15", memory_max = "32G" }, av3 = { cpus = "16-27", memory_max = "32G" } }

# fpdraw is EXCLUDE_FROM_ALL, so the build names it. `confine` does not reach
# the build, so taskset holds it to the host's agreed CPUs, chosen by short
# host name: av2 reports itself as avlab12.
build = "sh -c 'case $(hostname -s) in av3) c=16-27;; *) c=0-15;; esac; taskset -c $c sh -c \"cmake --build build-release -j 16 && cmake --build build-release -j 16 --target fpdraw\"'"

# Every subject is in the copied pool, so this phase only copies it, after
# checking each file against its index row.
[[phases]]
name = "2026-11-17-fretish-order-remove-no-f-pooled"
kind = "pool"
design = "experiments/2026-11-17-fretish-order-remove-no-f-pooled/design.toml"
subjects = "experiments/2026-11-17-fretish-order-remove-no-f-pooled/subjects-{host}.txt"
copy_from = "experiments/2026-11-17-fretish-order-remove-no-f-pooled/members"
out = "experiments/fretish-order-remove-no-f-pooled-members"

# 32768 words a subject over the members (black, 30 s a draw, 8 at a time),
# every node evaluated on them, and the pairs the design's three contrasts need:
# within each arm, which the frontier and so the share need, and across each
# contrast's two arms, which the plan check in pooled_reduce.py expects.
[[phases]]
name = "2026-11-17-fretish-order-remove-no-f-pooled"
kind = "fingerprint"
subjects = "experiments/2026-11-17-fretish-order-remove-no-f-pooled/subjects-{host}.txt"
members = "experiments/fretish-order-remove-no-f-pooled-members"
design = "experiments/2026-11-17-fretish-order-remove-no-f-pooled/design.toml"
work = "experiments/fretish-order-remove-no-f-pooled-work"
out = "experiments/fretish-order-remove-no-f-pooled/fp"
pairs = "experiments/fretish-order-remove-no-f-pooled-work/pairs-{host}.csv"
words = 32768
seed = 3
workers = 8
black_timeout = 30

# Every planned pair, each unrefuted direction at the archive's 20 s.
[[phases]]
name = "2026-11-17-fretish-order-remove-no-f-pooled"
kind = "compare"
pairs = "experiments/fretish-order-remove-no-f-pooled-work/pairs-{host}.csv"
out = "experiments/fretish-order-remove-no-f-pooled/subsumption-{host}.csv"
# 12, not 16: av3 has 12 CPUs here, and a 20 s comparison timed out by
# contention would change the result.
jobs = 12
black_timeout = 20
wall_timeout = 180
vmem_kb = 8388608
