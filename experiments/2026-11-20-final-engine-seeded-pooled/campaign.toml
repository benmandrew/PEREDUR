name = "2026-11-20-final-engine-seeded-pooled"
branch = "campaign/final-engine"
description = "Pooled pass over the sideways seeded corpus of 2026-11-20-final-engine: sweep F's ten nsga2-apportion arms, seeds 0-4, on its 130 subjects less any where an arm holds 3 or fewer members, every pair of arms planned, for share, containment at K = 3 and joint-front reach with seed-half controls (paper bennote item 5)."

# The runs' seeds are split over av2 and av3, so the pool is built locally
# after `collect`, then copied with the design and subject lists (untracked,
# written by 2026-11-20-final-engine-pooled/scripts/make_design.py) to each
# host's checkout by rsync before enqueue (2026-11-20-final-engine PLAN.md).
hosts = { av2 = "", av3 = "" }

# CPU windows. Every phase names its host, seeds, CPUs and memory on one
# line, so a window moves with one substitution per host, for example
#   sed -i '/av2 = { cpus/ s/cpus = "0-29"/cpus = "0-15"/' campaign.toml
# and `jobs` must then shrink with it (CPUs over threads a run). CPUs 30-31
# stay free for the Ollama server on both hosts.
# CPUs 0-13 on both hosts from 21 Nov: veribee holds CPUs 14-29 (and up to
# 32G) from when -large ends on each host until Mon 23 Nov 06:00Z (mailbox,
# 01:30Z), so the reduce cap drops from 96G to 80G to leave room for it.
confine = { av2 = { cpus = "0-13", memory_max = "64G" }, av3 = { cpus = "0-13", memory_max = "64G" } }

# fpdraw is EXCLUDE_FROM_ALL, so the build names it. `confine` does not reach
# the build, so taskset holds it to the same CPUs.
build = "sh -c 'taskset -c 0-13 sh -c \"cmake --build build-release -j 12 && cmake --build build-release -j 12 --target fpdraw\"'"

# Estimate: the sideways runs returned a median of 777 repairs a subject over ten arms and five seeds (most a few hundred nodes after pooling), so compare is small, about 5-10 call-h; the 130 fingerprint draws dominate, 20-60 CPU-h, so 1-2 h a host (+-50%; no earlier pass of this shape).

# Every subject is in the copied pool, so this phase only copies it, after
# checking each file against its index row.
[[phases]]
name = "pool"
kind = "pool"
design = "experiments/2026-11-20-final-engine-seeded-pooled/design.toml"
subjects = "experiments/2026-11-20-final-engine-seeded-pooled/subjects-{host}.txt"
copy_from = "experiments/2026-11-20-final-engine-seeded-pooled/members"
out = "experiments/final-engine-seeded-pooled-members"

# 32768 words a subject (black, 30 s a draw, 8 at a time), every node
# evaluated on them, and every pair the design plans: every pair of the ten
# arms is a contrast.
[[phases]]
name = "fingerprint"
kind = "fingerprint"
subjects = "experiments/2026-11-20-final-engine-seeded-pooled/subjects-{host}.txt"
members = "experiments/final-engine-seeded-pooled-members"
design = "experiments/2026-11-20-final-engine-seeded-pooled/design.toml"
work = "experiments/final-engine-seeded-pooled-work"
out = "experiments/final-engine-seeded-pooled/fp"
pairs = "experiments/final-engine-seeded-pooled-work/pairs-{host}.csv"
words = 32768
seed = 3
workers = 8
black_timeout = 30

# Each unrefuted direction at the archive's 20 s, 12 jobs as the earlier
# pooled passes ran, so a 20 s comparison is not timed out by contention.
[[phases]]
name = "compare"
kind = "compare"
pairs = "experiments/final-engine-seeded-pooled-work/pairs-{host}.csv"
out = "experiments/final-engine-seeded-pooled/subsumption-{host}.csv"
jobs = 12
black_timeout = 20
wall_timeout = 180
vmem_kb = 8388608

# On av2 alone, once av3's entry has passed its compare phase: gather both
# hosts' outputs, then pooled_reduce.py (strength, and pooled ball radii at
# K = 3 with each arm's seed-half control) and joint_measures.py (share,
# joint-front reach, and each arm's odd-against-even reach control). av3
# cannot ssh to av2, so av2 gathers.
[[phases]]
name = "reduce"
kind = "reduce"
host = "av2"
design = "experiments/2026-11-20-final-engine-seeded-pooled/design.toml"
members = "experiments/2026-11-20-final-engine-seeded-pooled/members"
outputs = "experiments/final-engine-seeded-pooled"
collected = "experiments/final-engine-seeded-pooled-collected"
out = "experiments/final-engine-seeded-pooled-reduced"
confine = { av2 = { cpus = "0-13", memory_max = "80G" } }
jobs = 4
pooled_balls = true
ball_k = [3]
joint = true
half_control = true
